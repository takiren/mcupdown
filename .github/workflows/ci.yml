name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 本番は Linux、macOS は開発用
        goos: [linux, darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        if: matrix.goos == 'linux'
        run: go mod tidy -diff
      - name: go generate
        if: matrix.goos == 'linux'
        run: |
          go generate ./...
          git diff --exit-code || { echo "::error::生成コードが古い。go generate ./... を実行してコミットすること"; exit 1; }
      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -shuffle=on ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        run: |
          curl -sSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck
        run: shellcheck scripts/*.sh

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    env:
      ANSIBLE_LINT_VERSION: 26.9.0
    steps:
      - uses: actions/checkout@v7
      # 構文チェック（syntax-check）も ansible-lint の中で行われる
      - name: ansible-lint
        run: pipx run --spec "ansible-lint==${ANSIBLE_LINT_VERSION}" ansible-lint -c deploy/ansible/.ansible-lint deploy/ansible
